version: '3.8'

# ==============================================================================
# DRIVERYO 3-TIER SELF-HOSTED STACK (RUN FROM LOCAL SYSTEM)
# ==============================================================================

services:
  # ============================================================================
  # TIER 3: DATA TIER (PostgreSQL 16, Redis 7 In-Memory Cache, MinIO S3 Storage)
  # ============================================================================
  database:
    image: postgres:16-alpine
    container_name: driveryo_db_tier3
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: driveryo_secure_local_password
      POSTGRES_DB: driveryo_production
    ports:
      - "5432:5432"
    volumes:
      - pgdata_tier3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - driveryo-internal

  cache:
    image: redis:7-alpine
    container_name: driveryo_cache_tier3
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata_tier3:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - driveryo-internal

  storage:
    image: minio/minio:latest
    container_name: driveryo_storage_tier3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: driveryo_admin
      MINIO_ROOT_PASSWORD: driveryo_minio_secret_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata_tier3:/data
    networks:
      - driveryo-internal

  # ============================================================================
  # TIER 2: APPLICATION & BUSINESS LOGIC TIER (NestJS / Node.js Backend API)
  # ============================================================================
  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: driveryo_api_tier2
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:driveryo_secure_local_password@database:5432/driveryo_production?schema=public
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://storage:9000
      - S3_ACCESS_KEY_ID=driveryo_admin
      - S3_SECRET_ACCESS_KEY=driveryo_minio_secret_password
      - S3_BUCKET_NAME=driveryo-documents
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - driveryo-internal

  # ============================================================================
  # TIER 1: PRESENTATION TIER (Next.js Customer Website & Admin Dashboard)
  # ============================================================================
  website:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.website
    container_name: driveryo_web_tier1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - backend
    networks:
      - driveryo-internal

  admin:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.admin
    container_name: driveryo_admin_tier1
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - backend
    networks:
      - driveryo-internal

networks:
  driveryo-internal:
    driver: bridge

volumes:
  pgdata_tier3:
  redisdata_tier3:
  miniodata_tier3:
