# ==============================================================================
# DRIVERYO NATIVE NGINX CONFIGURATION (NO DOCKER)
# Reverse Proxy with HTTP/2, Gzip, and WebSocket Telemetry Support
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CUSTOMER WEBSITE: driveryo.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name driveryo.com www.driveryo.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 2. ADMIN OPERATIONS CONSOLE: admin.driveryo.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name admin.driveryo.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 3. BACKEND API & WEBSOCKET RADAR: api.driveryo.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.driveryo.com;

    # Maximum file upload size for driver KYC licenses & inspection photos
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket support for live driver tracking & GPS updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-lived WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
